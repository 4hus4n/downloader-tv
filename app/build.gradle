plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahusan.tvdownloader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ahusan.tvdownloader'
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            storeFile file('keystore/release.jks')
            storePassword 'tvdownloader'
            keyAlias 'tvdownloader'
            keyPassword 'tvdownloader'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
